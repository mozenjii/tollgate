[project]
name = "tollgate"
version = "0.0.0"
description = "An OpenAI-compatible gateway that keeps an LLM feature up and inside budget, and moves a workload to a cheaper model only after a trial on its own traffic bounds their disagreement."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Mozenjii" }]
keywords = ["llm", "gateway", "openai", "routing", "reliability", "statistics"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: Proxy Servers",
]
# Empty on purpose until the gateway exists. Each runtime dependency arrives with the code
# that needs it, with a comment saying why it is worth carrying.
dependencies = []

[project.urls]
Source = "https://github.com/mozenjii/tollgate"

[dependency-groups]
# Pinned on purpose. A toolchain that drifts turns a green check into an opinion.
dev = [
  "ruff==0.14.2",
  "pyright==1.1.406",
  "pytest==9.0.3",
  "pytest-cov==7.0.0",
  # Dependency vulnerability scan. Not part of `check`: it queries a remote advisory
  # database, and a gate that needs the network fails for reasons unrelated to the change.
  # It runs as its own CI job instead.
  "pip-audit==2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tollgate"]

# ---------------------------------------------------------------------------
# Lint and format. One tool, so formatting can never disagree with linting.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # import sorting
  "N",           # naming
  "UP",          # pyupgrade
  "B",           # bugbear
  "A",           # shadowed builtins
  "C4",          # comprehensions
  "SIM",         # simplify
  "PTH",         # use pathlib
  "RUF",         # ruff's own
  "D",           # docstrings: every module and exported symbol carries one
  "ANN",         # annotations required
  "S",           # bandit security rules; this process will hold keys and money
  "T20",         # no stray print() in library code
  "ASYNC",       # blocking calls inside async code stall every request on the loop
]
ignore = [
  "D203",   # conflicts with D211; we keep D211 (no blank line before class docstring)
  "D213",   # conflicts with D212; we keep D212 (summary on the first line)
  "ANN401", # typing.Any is sometimes the honest annotation
]

[tool.ruff.lint.per-file-ignores]
# Tests document themselves by name and assert freely.
"tests/**" = ["D100", "D103", "S101"]
# The check runner's whole job is to print to a terminal and shell out.
"tools/**" = ["T201", "S603"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# Types. Strict from the first commit: retrofitting strictness never happens.
# ---------------------------------------------------------------------------
[tool.pyright]
include = ["src", "tests", "tools"]
extraPaths = ["tools"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------------------
# Tests and coverage.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-q --strict-markers --strict-config"
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["src/tollgate"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
